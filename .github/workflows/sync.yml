name: Housekeeping

on:
  schedule:
    - cron: "47 16 * * *"
    - cron: "37 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update files
        run: |
          DATE=$(date +"%Y-%m-%d")
          for f in license.md security.md contributing.md; do
            [ -f "$f" ] && sed -i -E "s/20[0-9]{2}-[0-9]{2}-[0-9]{2}/${DATE}/g" "$f"
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "Nothing to update" && exit 0
          git commit -m "docs: update date"
          git push
